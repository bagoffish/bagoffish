services:
  # Node API (proxy-roblox, health, robloxify)
  # Must stay a Web Service — NOT a Static Site.
  # URL should be https://winxp-7yes.onrender.com (or update public/js/renderer.js API_BASE)
  - type: web
    name: winxp-7yes
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"

  # Optional: frontend static site (bagof.fish).
  # If bagof.fish is already deployed as its own Static Site in the dashboard,
  # you can ignore this block or delete it to avoid a second frontend service.
  - type: web
    name: winxp-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
