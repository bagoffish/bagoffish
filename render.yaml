services:
  # Node API (proxy-roblox, health, robloxify)
  # Must stay a Web Service — NOT a Static Site.
  - type: web
    name: winxp-backend-live
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: winxp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"

  # Frontend static site
  - type: web
    name: winxp-frontend
    runtime: static
    # Clear broken caches; allow yarn to resolve lockfile without --frozen-lockfile
    buildCommand: rm -rf node_modules && yarn install --check-files && yarn build
    staticPublishPath: build
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
