name: Inspect forum archive bucket
on:
  push:
    branches: [archive-probe-forum]
    paths: [tools/forum/inspect.sh, .github/workflows/archive-probe-forum.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: archive-probe-forum }
      - run: bash tools/forum/inspect.sh
      - name: Commit inspection output
        if: always()
        run: |
          git config user.name "coy"
          git config user.email "c@bagof.fish"
          git add probe
          git commit -m "Forum bucket inspection output [skip ci]" || true
          git push origin HEAD:archive-probe-forum
