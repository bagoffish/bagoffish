name: Website and backend checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: |
          node --check server.js
          node --check personal-ai.js
          node --check bloxify.cjs
          node --check bloxify-core.cjs
      - name: Run backend tests
        working-directory: backend
        run: |
          npm install --no-package-lock
          npm test
      - name: Build website
        run: |
          npm install --no-package-lock
          npm run build
