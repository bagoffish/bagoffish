on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-compiled-site
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published site
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: false

      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          repository: bagoffish/bagoffish
          ref: main
          path: source
          submodules: false

      - name: Skip when source has not changed
        id: source-check
        shell: bash
        run: |
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [ -f site-source-commit.txt ] && [ "$(tr -d '\r\n' < site-source-commit.txt)" = "$SOURCE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Source is unchanged at $SOURCE_SHA; no build needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Building source commit $SOURCE_SHA."
          fi

      - name: Set up Node.js
        if: steps.source-check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
          cache: yarn
          cache-dependency-path: source/yarn.lock

      - name: Install dependencies and build
        if: steps.source-check.outputs.changed == 'true'
        working-directory: source
        env:
          CI: "false"
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: Verify compiled site assets
        if: steps.source-check.outputs.changed == 'true'
        working-directory: source
        shell: bash
        run: |
          test -s build/index.html || { echo "::error::Build is missing index.html"; exit 1; }
          test -s build/asset-manifest.json || { echo "::error::Build is missing asset-manifest.json"; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = JSON.parse(fs.readFileSync('build/asset-manifest.json', 'utf8'));
          const files = Object.values(manifest.files || {});
          if (!files.length) throw new Error('Asset manifest contains no files');
          const missing = files
            .filter((file) => typeof file === 'string' && file.startsWith('./'))
            .map((file) => file.slice(2))
            .filter((file) => !fs.existsSync(path.join('build', file)));
          if (missing.length) throw new Error('Missing built assets: ' + missing.join(', '));
          console.log('Verified ' + files.length + ' compiled asset references.');
          NODE

      - name: Publish compiled files while preserving avatar history
        if: steps.source-check.outputs.changed == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source-check.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish on top of the latest main instead of rebasing a stale generated
          # commit over concurrent edits to index.html or asset-manifest.json.
          # rsync intentionally avoids deleting unrelated files, including avatar history.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            rsync -a source/build/ ./ --exclude='.git/' --exclude='source/'
            # Keep only the current build's generated bundles; preserve unrelated root assets and avatar history.
            rsync -a --delete source/build/static/ ./static/
            printf '%s\\n' "$SOURCE_SHA" > site-source-commit.txt
            test -s index.html || { echo "::error::Published site is missing index.html"; exit 1; }
            test -s asset-manifest.json || { echo "::error::Published site is missing asset-manifest.json"; exit 1; }
            test "$(tr -d '\\r\\n' < site-source-commit.txt)" = "$SOURCE_SHA" || { echo "::error::Published source SHA does not match checked-out source"; exit 1; }

            # Never stage the nested private source checkout as a submodule pointer.
            git add -A -- . ':(exclude)source'
            if git diff --cached --quiet; then
              echo "Build produced no file changes."
              exit 0
            fi

            git commit -m "Build site from winXP source $SOURCE_SHA"
            if git push origin HEAD:main; then
              echo "Published source $SOURCE_SHA successfully."
              exit 0
            fi
            echo "Push attempt $attempt lost a race with another main update; retrying on the latest main."
          done

          echo "::error::Could not publish after three attempts."
          exit 1
