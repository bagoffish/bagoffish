name: Deploy FxEmbed Worker

on:
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "workers/**"
      - ".github/workflows/deploy-fxembed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fxembed-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy FxEmbed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and FxEmbed submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/fxembed/package-lock.json

      - name: Install FxEmbed dependencies
        working-directory: workers/fxembed
        run: npm ci

      - name: Configure FxEmbed
        working-directory: workers/fxembed
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CF_ACCOUNT_ID}" || { echo "::error::Add CF_ACCOUNT_ID to repository Actions secrets."; exit 1; }

          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          env_path = Path(".env")
          env, changed = re.subn(
              r"^STANDARD_DOMAIN_LIST\s*=.*$",
              'STANDARD_DOMAIN_LIST = "bagof.fish,fxtwitter.com,fixupx.com,twittpr.com"',
              env_path.read_text(),
              count=1,
              flags=re.MULTILINE,
          )
          if changed != 1:
              raise SystemExit("Could not configure STANDARD_DOMAIN_LIST")
          env_path.write_text(env)

          branding = json.loads(Path("branding.example.json").read_text())
          for zone in branding.get("zones", []):
              if zone.get("provider") == "twitter" and zone.get("default"):
                  zone["name"] = "bag of fish"
                  zone["redirect"] = "https://bagof.fish"
                  domains = zone.setdefault("domains", [])
                  if "bagof.fish" not in domains:
                      domains.insert(0, "bagof.fish")
                  break
          else:
              raise SystemExit("Could not find the default Twitter branding zone")

          Path("branding.json").write_text(json.dumps(branding, indent=2) + "\n")
          PY

          cat > wrangler.toml <<EOF
          name = "bagoffish-fxembed"
          account_id = "${CF_ACCOUNT_ID}"
          main = "./dist/bagofish-worker.js"
          compatibility_date = "2026-04-11"
          send_metrics = false
          workers_dev = false
          EOF

      - name: Build FxEmbed Worker
        working-directory: workers/fxembed
        run: |
          set -euo pipefail
          npm run build
          npx esbuild ../fxembed-dispatcher.ts --bundle --format=esm --outfile=dist/bagofish-worker.js

      - name: Deploy Worker
        working-directory: workers/fxembed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Add CLOUDFLARE_API_TOKEN to repository Actions secrets."; exit 1; }
          # The existing bagof.fish/* route is configured in Cloudflare; only upload new Worker code here.
          npx wrangler deploy --config wrangler.toml --no-bundle

      - name: Diagnose Twitter embed response
        continue-on-error: true
        run: |
          set -u
          probe() {
            label="$1"
            url="$2"
            body="$(mktemp)"
            status="$(curl -sSL --max-time 30 -A 'Discordbot/2.0' -o "$body" -w '%{http_code}' "$url" || true)"
            echo "===== $label: HTTP ${status:-request-failed} ====="
            python3 - "$body" <<'PY'
          import html, json, re, sys
          from pathlib import Path
          body = Path(sys.argv[1]).read_text(errors="replace")
          try:
              data = json.loads(body)
          except Exception:
              data = None
          if isinstance(data, dict):
              print("JSON code/message:", data.get("code"), data.get("message"))
              tweet = data.get("tweet") or {}
              print("tweet keys:", sorted(tweet.keys()))
              print("tweet text:", str(tweet.get("text", ""))[:300])
              print("author:", (tweet.get("author") or {}).get("screen_name"))
              print("media:", json.dumps(tweet.get("media"), ensure_ascii=False)[:2500])
          else:
              metas = {}
              for tag in re.findall(r'<meta\b[^>]*>', body, re.I):
                  attrs = dict(re.findall(r"""([\w:-]+)\s*=\s*["']([^"']*)["']""", tag))
                  name = attrs.get("property") or attrs.get("name")
                  if name and (name.lower().startswith(("og:", "twitter:")) or name.lower() == "description"):
                      metas[name] = html.unescape(attrs.get("content", ""))
              title = re.search(r'<title[^>]*>(.*?)</title>', body, re.I | re.S)
              print("title:", html.unescape(re.sub(r'\s+', ' ', title.group(1)).strip()) if title else "(none)")
              for key, value in metas.items():
                  print(f"{key}: {value[:600]}")
              if not metas:
                  clean = re.sub(r'<!--.*?-->', ' ', body, flags=re.S)
                  visible = html.unescape(re.sub(r'<[^>]+>', ' ', clean))
                  print("visible page text:", re.sub(r'\s+', ' ', visible).strip()[:1000])
          PY
            rm -f "$body"
          }
          probe "bagof.fish" "https://bagof.fish/bananvn/status/2110801176640065627"
          probe "FxTwitter API" "https://api.fxtwitter.com/bananvn/status/2110801176640065627"
          probe "fxtwitter.com" "https://fxtwitter.com/bananvn/status/2110801176640065627"
