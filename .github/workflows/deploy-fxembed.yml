name: Deploy FxEmbed Worker

on:
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "workers/**"
      - ".github/workflows/deploy-fxembed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fxembed-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy FxEmbed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and FxEmbed submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/fxembed/package-lock.json

      - name: Install FxEmbed dependencies
        working-directory: workers/fxembed
        run: npm ci

      - name: Prepare build config
        working-directory: workers/fxembed
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CF_ACCOUNT_ID}" || { echo "::error::Add CF_ACCOUNT_ID (or R2_ACCOUNT_ID) to repository Actions secrets."; exit 1; }
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          env_path = Path(".env")
          env, changed = re.subn(
              r"^STANDARD_DOMAIN_LIST\s*=.*$",
              'STANDARD_DOMAIN_LIST = "bagof.fish,fxtwitter.com,fixupx.com,twittpr.com"',
              env_path.read_text(),
              count=1,
              flags=re.MULTILINE,
          )
          if changed != 1:
              raise SystemExit("Could not set STANDARD_DOMAIN_LIST in .env")
          env_path.write_text(env)

          branding_path = Path("branding.example.json")
          branding = json.loads(branding_path.read_text())
          for zone in branding.get("zones", []):
              if zone.get("provider") == "twitter" and zone.get("default"):
                  zone["name"] = "bag of fish"
                  zone["redirect"] = "https://bagof.fish"
                  domains = zone.setdefault("domains", [])
                  if "bagof.fish" not in domains:
                      domains.insert(0, "bagof.fish")
                  break
          branding_path.write_text(json.dumps(branding, indent=2) + "\n")
          PY

          cat > wrangler.toml <<EOF
          name = "bagoffish-fxembed"
          account_id = "${CF_ACCOUNT_ID}"
          main = "./dist/bagofish-worker.js"
          compatibility_date = "2026-04-11"
          send_metrics = false
          workers_dev = false

          # The existing bagof.fish/* route is reassigned through the Cloudflare API
          # after the new Worker has been uploaded.

          [build]
          command = "npm run build && npx esbuild ../fxembed-dispatcher.ts --bundle --format=esm --outfile=dist/bagofish-worker.js"
          EOF

      # Logged-in credentials are optional; public posts may still be rate limited without them.
      - name: Fetch encrypted credentials from R2 (optional)
        id: credentials
        working-directory: workers/fxembed
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: bagoffish-media
          CREDENTIAL_KEY: ${{ secrets.CREDENTIAL_KEY }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CSRF_TOKEN: ${{ secrets.TWITTER_CSRF_TOKEN }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
        run: |
          set -euo pipefail
          has_direct_twitter_creds=false
          if [[ -n "${TWITTER_AUTH_TOKEN}" || -n "${TWITTER_CSRF_TOKEN}" || -n "${TWITTER_USERNAME}" ]]; then
            has_direct_twitter_creds=true
          fi

          if [[ "${has_direct_twitter_creds}" == "true" ]]; then
            if [[ -z "${TWITTER_AUTH_TOKEN}" || -z "${TWITTER_CSRF_TOKEN}" || -z "${TWITTER_USERNAME}" || -z "${CREDENTIAL_KEY}" ]]; then
              echo "::error::For GitHub-secret credentials, set all of TWITTER_AUTH_TOKEN, TWITTER_CSRF_TOKEN, TWITTER_USERNAME, and CREDENTIAL_KEY."
              exit 1
            fi
            printf '%s' "${CREDENTIAL_KEY}" > .credential-key
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const account = {
              authToken: process.env.TWITTER_AUTH_TOKEN,
              csrfToken: process.env.TWITTER_CSRF_TOKEN,
              username: process.env.TWITTER_USERNAME
            };
            for (const [key, value] of Object.entries(account)) {
              if (typeof value !== 'string' || !value.trim()) {
                throw new Error(`Missing Twitter credential field: ${key}`);
              }
            }
            fs.writeFileSync('credentials.json', JSON.stringify({ twitter: { accounts: [account] } }) + '\n', { mode: 0o600 });
          NODE
            npm run credentials:encrypt
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Bundled encrypted Twitter credentials from GitHub Actions secrets."
          elif [[ -n "${R2_ACCOUNT_ID}" && -n "${R2_ACCESS_KEY_ID}" && -n "${R2_SECRET_ACCESS_KEY}" && -n "${CREDENTIAL_KEY}" ]]; then
            node tools/credential-tools.mjs pull
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const data = JSON.parse(fs.readFileSync('credentials.enc.json', 'utf8'));
            if (typeof data.ciphertext !== 'string' || !data.ciphertext.length ||
                typeof data.iv !== 'string' || !data.iv.length) {
              throw new Error('credentials.enc.json must contain non-empty ciphertext and iv strings');
            }
          NODE
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Loaded encrypted credentials from R2."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            rm -f credentials.enc.json credentials.json .credential-key
            echo "::warning::No Twitter credential secrets or complete R2 credential setup found. Continuing without logged-in account credentials."
          fi

      - name: Build FxEmbed Worker bundle
        working-directory: workers/fxembed
        run: |
          set -euo pipefail
          npm run build
          npx esbuild ../fxembed-dispatcher.ts --bundle --format=esm --outfile=dist/bagofish-worker.js

      - name: Deploy Worker
        working-directory: workers/fxembed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CREDENTIAL_KEY: ${{ secrets.CREDENTIAL_KEY }}
          CREDENTIALS_CONFIGURED: ${{ steps.credentials.outputs.configured }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Add CLOUDFLARE_API_TOKEN to repository Actions secrets."; exit 1; }
          npx wrangler deploy --config wrangler.toml --no-bundle
          if [[ "${CREDENTIALS_CONFIGURED}" == "true" ]]; then
            printf '%s' "${CREDENTIAL_KEY}" | npx wrangler secret put CREDENTIAL_KEY --config wrangler.toml
          fi

      - name: Reassign bagof.fish route to FxEmbed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: 9aa38ccc825f360df7c326d434ab6034
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const zoneId = process.env.CF_ZONE_ID;
          const routePattern = "bagof.fish/*";
          const workerName = "bagoffish-fxembed";

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers ?? {})
              }
            });
            const result = await response.json();
            if (!response.ok || result.success !== true) {
              const details = (result.errors ?? []).map((error) => error.message).join("; ");
              throw new Error(`Cloudflare API failed (${response.status}): ${details || "unknown error"}`);
            }
            return result.result;
          }

          if (!token || !zoneId) throw new Error("Missing Cloudflare token or zone ID.");

          const routes = await cloudflare(`/zones/${zoneId}/workers/routes`);
          const matches = routes.filter((route) => route.pattern === routePattern);
          if (matches.length > 1) {
            throw new Error(`Found ${matches.length} duplicate routes for ${routePattern}; refusing to change them automatically.`);
          }

          if (matches.length === 1) {
            const route = matches[0];
            if (route.script === workerName) {
              console.log(`Route ${routePattern} is already assigned to ${workerName}.`);
            } else {
              await cloudflare(`/zones/${zoneId}/workers/routes/${route.id}`, {
                method: "PUT",
                body: JSON.stringify({ pattern: routePattern, script: workerName })
              });
              console.log(`Reassigned ${routePattern} from ${route.script ?? "(no script)"} to ${workerName}.`);
            }
          } else {
            await cloudflare(`/zones/${zoneId}/workers/routes`, {
              method: "POST",
              body: JSON.stringify({ pattern: routePattern, script: workerName })
            });
            console.log(`Created route ${routePattern} for ${workerName}.`);
          }
          NODE
