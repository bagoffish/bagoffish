name: Check forum archive API
on:
  push:
    branches: [froast-api-probe]
    paths: [tools/froast/probe.sh, .github/workflows/froast-api-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/froast/probe.sh
      - name: Save results
        if: always()
        run: |
          git config user.name "coy"
          git config user.email "c@bagof.fish"
          git add probe
          git commit -m "Forum archive API check results [skip ci]" || true
          git push origin HEAD:froast-api-probe
