name: Check Wayback forum coverage
on:
  push:
    branches: [wayback-forum-probe]
    paths: [tools/wayback/probe.py, .github/workflows/wayback-forum-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/wayback/probe.py
      - name: Save results
        if: always()
        run: |
          git config user.name "coy"
          git config user.email "c@bagof.fish"
          git add probe
          git commit -m "Wayback forum coverage results [skip ci]" || true
          git push origin HEAD:wayback-forum-probe
