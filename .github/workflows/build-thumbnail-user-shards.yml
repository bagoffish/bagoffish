name: Build full thumbnail user shards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Download and process extracted index parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/shards
          cat > work/build_shards.py <<'PY'
          import gzip, hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs, unquote

          ROOT = Path("work")
          SHARDS = ROOT / "shards"
          SHARDS.mkdir(parents=True, exist_ok=True)
          COUNT = 256
          USER_KEY = re.compile(r"(?:^|[_-])(?:user_?id|userids|target_?id|creator_?id|owner_?id)(?:$|[_-])", re.I)
          TIME_KEY = re.compile(r"(?:timestamp|capture_?time|archived_?at|crawl_?time|datetime|date)", re.I)
          AVATAR_URL = re.compile(r"(?:avatar|headshot|user-thumbnail|avatarimage)", re.I)
          NON_AVATAR = re.compile(r"(?:game|asset|audio|place|universe|group|badge|catalog|item|bundle|decal|mesh|texture|animation|plugin|shirt|pants|tshirt)", re.I)
          USER_ID_RE = re.compile(r"/users/(\d+)(?:/|$)", re.I)
          WAYBACK_RE = re.compile(r"^https?://web\.archive\.org/web/(\d{8,14})(?:[a-z_]+)?/(https?://.*)$", re.I)
          ID_QUERY_KEYS = {"userid", "userids", "user_id", "user_ids", "targetid", "target_id", "creatorid", "ownerid", "id"}

          handles = [gzip.open(SHARDS / f"full-s{i}.txt.gz", "wt", encoding="utf-8", newline="\n", compresslevel=6) for i in range(COUNT)]
          counts = [0] * COUNT
          total = malformed = matched = 0
          total_bytes = 0
          samples = []
          diagnostics = {"url_strings": 0, "avatar_keyword_urls": 0, "records_with_explicit_user_ids": 0, "records_with_avatar_urls": 0, "top_level_key_samples": []}
          digest = hashlib.sha256()

          def normalize_stamp(value):
              if value is None:
                  return ""
              raw = str(value).strip()
              digits = re.sub(r"\D", "", raw)
              if len(digits) in (10, 13) and digits.startswith(("1", "2")):
                  try:
                      from datetime import datetime, timezone
                      epoch = int(digits) / (1000 if len(digits) == 13 else 1)
                      return datetime.fromtimestamp(epoch, timezone.utc).strftime("%Y%m%d%H%M%S")
                  except (ValueError, OverflowError, OSError):
                      return ""
              if len(digits) < 8:
                  return ""
              return (digits + "00000000000000")[:14]

          def matches_user(url, user_id):
              if not isinstance(url, str):
                  return False
              raw = unquote(url)
              if re.search(r"/users?/" + re.escape(user_id) + r"(?:/|$)", raw, re.I):
                  return True
              try:
                  query = parse_qs(urlparse(raw).query)
                  return any(
                      key.lower() in {"id", "userid", "user_id"} and user_id in values
                      for key, values in query.items()
                  )
              except Exception:
                  return False

          def normalize_url(value):
              value = str(value or "").strip()
              if value.startswith("//"):
                  value = "https:" + value
              if not value.startswith(("http://", "https://")):
                  return ""
              match = WAYBACK_RE.match(value)
              return match.group(2) if match else value

          manifest_name = "thumbnail-index-manifest.json"
          subprocess.run([
              "gh", "release", "download", "thumbnail-index-full-v1",
              "--repo", os.environ["GITHUB_REPOSITORY"],
              "--pattern", manifest_name, "--dir", str(ROOT)
          ], check=True)
          source_manifest = json.loads((ROOT / manifest_name).read_text(encoding="utf-8"))
          parts = [
              item["file"] for item in source_manifest.get("chunks", [])
              if item.get("file", "").startswith("thumbnail_index.jsonl.part")
          ]
          if not parts:
              raise SystemExit("The extracted-index manifest contains no source chunks.")
          print(
              f"Manifest lists {len(parts)} source chunks; expected {source_manifest.get('total_bytes')} bytes.",
              flush=True
          )

          for part_name in parts:
              subprocess.run([
                  "gh", "release", "download", "thumbnail-index-full-v1",
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--pattern", part_name, "--dir", str(ROOT)
              ], check=True)
              part_path = ROOT / part_name
              with part_path.open("rb") as src:
                  for raw in src:
                      total += 1
                      total_bytes += len(raw)
                      digest.update(raw)
                      try:
                          record = json.loads(raw)
                      except Exception:
                          malformed += 1
                          continue
                      if not isinstance(record, dict) or str(record.get("type", "")).lower() != "user":
                          continue
                      raw_id = record.get("id")
                      if raw_id is None or not str(raw_id).isdigit() or int(raw_id) <= 0:
                          continue
                      user_id = str(int(raw_id))
                      images = record.get("images")
                      if not isinstance(images, list):
                          continue
                      diagnostics["records_with_explicit_user_ids"] += 1
                      record_matched = False
                      for item in images:
                          if not isinstance(item, dict):
                              continue
                          raw_url = str(item.get("url") or "").strip()
                          url = normalize_url(raw_url)
                          if not url or not AVATAR_URL.search(url):
                              continue
                          if NON_AVATAR.search(urlparse(url).path):
                              continue
                          diagnostics["avatar_keyword_urls"] += 1
                          backlinks = item.get("backlinks") if isinstance(item.get("backlinks"), list) else []
                          stamps = sorted({
                              normalized
                              for backlink in backlinks
                              if isinstance(backlink, dict) and matches_user(backlink.get("url"), user_id)
                              for normalized in [normalize_stamp(backlink.get("timestamp"))]
                              if normalized
                          })
                          if not stamps:
                              fallback = normalize_stamp(item.get("first_seen") or item.get("last_seen"))
                              if fallback:
                                  stamps = [fallback]
                          if not stamps:
                              continue
                          shard = int(user_id) % COUNT
                          for stamp in stamps:
                              handles[shard].write(f"{user_id}\t{stamp}\t{url}\n")
                              counts[shard] += 1
                              matched += 1
                              record_matched = True
                              if len(samples) < 10:
                                  samples.append({"userId": user_id, "timestamp": stamp, "url": url})
                      if record_matched:
                          diagnostics["records_with_avatar_urls"] += 1
              part_path.unlink()
              print(f"Processed {part_name}; total lines={total:,}, accepted avatar captures={matched:,}", flush=True)

          for handle in handles:
              handle.close()

          actual_sha256 = digest.hexdigest()
          print("INDEX SCHEMA / FILTER DIAGNOSTICS:", json.dumps(diagnostics, ensure_ascii=False), flush=True)
          print(f"INDEX FILTER OUTPUT: records_written={sum(counts):,}; matched_records={matched:,}; nonempty_shards={sum(1 for n in counts if n)}", flush=True)
          # Fail closed rather than overwriting known-good shards with an almost-empty index.
          if sum(counts) < 100_000 or sum(1 for n in counts if n) < 200:
              raise SystemExit("Avatar filter matched too few records. Existing release shards were not uploaded; use the diagnostics to correct the source schema/filter.")
          expected_sha256 = source_manifest.get("sha256")
          expected_bytes = source_manifest.get("total_bytes")
          if expected_bytes is not None and total_bytes != int(expected_bytes):
              raise SystemExit(f"Extracted chunks incomplete: read {total_bytes} bytes; manifest says {expected_bytes}.")
          if expected_sha256 and actual_sha256.lower() != str(expected_sha256).lower():
              raise SystemExit(f"Extracted chunk SHA-256 mismatch: {actual_sha256} != {expected_sha256}.")

          output_manifest = {
              "source_release": "thumbnail-index-full-v1",
              "source_manifest": manifest_name,
              "source_parts": len(parts),
              "source_manifest_bytes": source_manifest.get("total_bytes"),
              "format": "gzip TSV: userId<TAB>timestamp<TAB>original avatar image URL",
              "shard_count": COUNT,
              "records_written": sum(counts),
              "matched_records": matched,
              "total_lines": total,
              "malformed_lines": malformed,
              "source_bytes_read": total_bytes,
              "source_sha256_verified": actual_sha256,
              "nonempty_shards": sum(1 for n in counts if n),
              "sample_records": samples,
              "note": "Generated from avatar/headshot URL records; inspect samples before switching production backend.",
              "shards": [{"file": f"full-s{i}.txt.gz", "records": counts[i], "bytes": (SHARDS / f"full-s{i}.txt.gz").stat().st_size} for i in range(COUNT)]
          }
          (ROOT / "full-thumbnail-index-manifest.json").write_text(json.dumps(output_manifest, indent=2), encoding="utf-8")
          print(json.dumps({k: output_manifest[k] for k in ("source_parts", "total_lines", "matched_records", "records_written", "malformed_lines", "nonempty_shards", "sample_records")}, indent=2))
          PY
          python3 work/build_shards.py

      - name: Upload sharded index and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload thumbnail-index-full-v2 work/shards/full-s*.txt.gz work/full-thumbnail-index-manifest.json --repo "${GITHUB_REPOSITORY}" --clobber
