<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>winter_letter</title>
    <link rel="stylesheet" href="/winter-letter/styles.css">
</head>
<body>

    <!-- TITLE SCREEN -->
    <div id="title-screen">
        <div class="letter-stage" aria-label="Winter Letter title">
            <div class="letter-sheet">
                <div class="letter-date">A WINTER ACCOUNT</div>
                <div class="letter-rule"></div>
                <div id="title-art">
                    <div class="title-kicker">A PSYCHOLOGICAL THRILLER</div>
                    <h1 class="letter-title">Winter<br><em>Letter</em></h1>
                    <p class="letter-subtitle">Some things are written long before they happen.</p>
                </div>
                <div class="letter-signoff">— an unfinished confession</div>
                <div class="letter-stamp" aria-hidden="true">W</div>
            </div>
            <div class="top-menu">
                <a onclick="startGame()">Open the letter</a>
                <span class="menu-divider">·</span>
                <a onclick="toggleLanguage()">한국어 / English</a>
            </div>
        </div>
        <div class="footer">winter_letter</div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="background"></div>
        <div id="overlay"></div>

        <img id="character" src="" alt="">

        <div id="textbox">
            <div id="namebox"></div>
            <div id="text"></div>
        </div>

        <div id="letter-box" style="display: none;">
            <div id="letter-paper">
                <div id="letter-text"></div>
            </div>
        </div>
    </div>

    <!-- CREDITS -->
    <div id="credits-screen" style="display: none; position: fixed; inset: 0; background: #000; color: #e8e4d9; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center; opacity: 0; transition: opacity 2s ease;">
        <div class="credits-paper">
            <p class="credits-small">THE END</p>
            <h1>Winter Letter</h1>
            <p class="credits-byline">A story by <a href="https://github.com/bagoffish" target="_blank">Coy</a></p>
            <button onclick="returnToTitle()">Return to the first page</button>
        </div>
    </div>

    <audio id="bgMusic" loop></audio>
    <audio id="titleMusic" loop></audio>
    <audio id="sfx"></audio>

    <script src="/winter-letter/script.js"></script>
</body>
</html>
