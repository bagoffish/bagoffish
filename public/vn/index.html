<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>winter_letter</title>
    <link rel="stylesheet" href="/vn/styles.css">
</head>
<body>

    <!-- TITLE SCREEN -->
    <div id="title-screen">
        <div class="top-menu">
            <a onclick="startGame()">START</a>
            <a onclick="toggleLanguage()">KOREAN</a>
        </div>

        <div id="title-art">
            <img src="/vn/images/title.png" alt="WINTER LETTER">
        </div>

        <div class="footer">winter_letter</div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="background"></div>
        <div id="overlay"></div>

        <img id="character" src="" alt="">

        <div id="textbox">
            <div id="namebox"></div>
            <div id="text"></div>
        </div>

        <div id="letter-box" style="display: none;">
            <div id="letter-paper">
                <div id="letter-text"></div>
            </div>
        </div>
    </div>

    <!-- CREDITS -->
    <div id="credits-screen" style="display: none; position: fixed; inset: 0; background: #000; color: #e8e4d9; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center; opacity: 0; transition: opacity 2s ease;">
        <h1 style="font-size: 3.2rem; letter-spacing: 12px; margin-bottom: 80px; color: #c8d7ff;">WINTER LETTER</h1>
        <p style="font-size: 1.6rem; line-height: 2.4; max-width: 600px;">
            Story by <a href="https://github.com/bagoffish" target="_blank" style="color:#c8d7ff; text-decoration: underline;">Coy</a>
        </p>
        <button onclick="returnToTitle()" style="margin-top: 80px; padding: 16px 48px; font-size: 1.4rem; background: transparent; border: 2px solid #c8d7ff; color: #c8d7ff; cursor: pointer; letter-spacing: 4px; transition: all 0.3s;">
            RETURN TO TITLE
        </button>
    </div>

    <audio id="bgMusic" loop></audio>
    <audio id="titleMusic" loop></audio>
    <audio id="sfx"></audio>

    <script src="/vn/script.js"></script>
</body>
</html>
